 <text x="70" y="195" fill="#103C33" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="760" letter-spacing="-1.6">Build healthier habits.</text>
 <text x="70" y="244" fill="#103C33" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="760" letter-spacing="-1.6">Stay consistent. Live better.</text>
 <text x="71" y="280" fill="#34685C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">From daily health data to lasting everyday change.</text>
