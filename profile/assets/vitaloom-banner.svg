<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">VitaLoom — Build healthier habits. Stay consistent. Live better.</title>
<desc id="desc">Green and mint VitaLoom brand banner with four health metrics and an illustrative personal health dashboard.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4FCF8"/><stop offset=".57" stop-color="#D5F3E6"/><stop offset="1" stop-color="#92D9BA"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#137652"/><stop offset="1" stop-color="#55C98C"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6FCF9"/></linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8ADDB7"/><stop offset="1" stop-color="#3AA582"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1D765D" flood-opacity=".15"/></filter>
  <clipPath id="rounded"><rect width="1200" height="420" rx="28"/></clipPath>
</defs>
